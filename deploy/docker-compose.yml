services:
  soliton-postgres:
    image: postgres:16-alpine
    container_name: soliton-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: soliton
      POSTGRES_USER: soliton
      POSTGRES_PASSWORD: ${SOLITON_DB_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soliton -d soliton"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - soliton-internal

  soliton-web:
    build:
      context: ./source
      dockerfile: Dockerfile
    image: soliton-web:latest
    container_name: soliton-web
    restart: unless-stopped
    depends_on:
      soliton-postgres:
        condition: service_healthy
    environment:
      DATABASE_URI: postgres://soliton:${SOLITON_DB_PASSWORD}@soliton-postgres:5432/soliton
      PAYLOAD_SECRET: ${SOLITON_PAYLOAD_SECRET}
      NEXT_PUBLIC_SITE_URL: https://pdumarket.ru
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # 057 P0: salt for sha256(IP) in consent records (152-ФЗ).
      IP_HASH_SALT: ${IP_HASH_SALT:-}
      # 057 US6: programmatic GA4 / Yandex Metrika (загружаются ТОЛЬКО после opt-in).
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      NEXT_PUBLIC_YANDEX_METRIKA_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_ID:-}
      # 058 v1: env-маркер для FR-271 (исключение dev/staging трафика из prod-стат)
      NEXT_PUBLIC_DEPLOYMENT_ENV: production
      # 058 v1: server-side hits (FR-040) + offline-conversions (FR-033/034).
      # YM_COUNTER_ID — обязателен для /api/analytics/server-hit endpoint.
      # YM_AGENT_TOKEN — нужен для offline-conversion в Yandex.Metrika Offline API
      # (без него server-hit будет работать, но offline-conversion вернёт skipped).
      YM_COUNTER_ID: ${YM_COUNTER_ID:-}
      YM_AGENT_TOKEN: ${YM_AGENT_TOKEN:-}
      # 057 follow-up: DaData suggest API (FIO + email autocomplete + address).
      # Free tier 10 000 req/day on suggest, ample for checkout traffic.
      # Empty value → form falls back to plain text input (graceful degradation).
      DADATA_API_KEY: ${DADATA_API_KEY:-}
      DADATA_SECRET: ${DADATA_SECRET:-}
      # 047: Яндекс.Карты v3 — публичный ключ клиентской карты ПВЗ в checkout.
      # NEXT_PUBLIC_ vars are baked into the browser bundle at build time.
      NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ${NEXT_PUBLIC_YANDEX_MAPS_API_KEY:-}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # Single canonical host: pdumarket.ru. www.pdumarket.ru gets a
      # dedicated router whose only job is to 301-redirect to apex
      # (consolidates SEO equity, avoids duplicate-content penalties).
      # The legacy soliton.heado.tech host was dropped — it never pointed
      # at this VPS, so Let's Encrypt ACME failed repeatedly and spammed
      # the Traefik log.
      # ─── Main router: serves apex (pdumarket.ru), applies secure-headers ───
      - "traefik.http.routers.soliton.rule=Host(`pdumarket.ru`)"
      - "traefik.http.routers.soliton.entrypoints=websecure"
      - "traefik.http.routers.soliton.tls.certresolver=letsencrypt"
      - "traefik.http.routers.soliton.middlewares=secure-headers@file"
      - "traefik.http.services.soliton.loadbalancer.server.port=3000"
      # ─── API router: stricter rate-limit on POST endpoints ───
      - "traefik.http.routers.soliton-api.rule=Host(`pdumarket.ru`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.soliton-api.entrypoints=websecure"
      - "traefik.http.routers.soliton-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.soliton-api.middlewares=secure-headers@file,api-rate-limit@file"
      - "traefik.http.routers.soliton-api.service=soliton"
      # ─── Admin login: brute-force throttle (5 attempts / minute / IP) ───
      - "traefik.http.routers.soliton-admin.rule=Host(`pdumarket.ru`) && (PathPrefix(`/admin/login`) || PathPrefix(`/admin/forgot`) || PathPrefix(`/admin/create-first-user`))"
      - "traefik.http.routers.soliton-admin.entrypoints=websecure"
      - "traefik.http.routers.soliton-admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.soliton-admin.middlewares=secure-headers@file,admin-rate-limit@file"
      - "traefik.http.routers.soliton-admin.service=soliton"
      # ─── WWW → apex 301 redirect (canonical host consolidation) ───
      - "traefik.http.routers.soliton-www.rule=Host(`www.pdumarket.ru`)"
      - "traefik.http.routers.soliton-www.entrypoints=websecure"
      - "traefik.http.routers.soliton-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.soliton-www.middlewares=www-to-apex@file"
      - "traefik.http.routers.soliton-www.service=soliton"
    networks:
      - proxy
      - soliton-internal

networks:
  proxy:
    external: true
  soliton-internal:
    driver: bridge
